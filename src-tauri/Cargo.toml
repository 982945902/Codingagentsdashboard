[package]
name = "coding-agents-dashboard"
version = "0.1.0"
description = "Desktop shell for Coding Agents Dashboard"
authors = ["Coding Agents Dashboard"]
edition = "2021"

[lib]
name = "coding_agents_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
